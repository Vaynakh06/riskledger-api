services:
  postgres:
    image: postgres:16-alpine
    container_name: riskledger-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riskledger}
      POSTGRES_USER: ${POSTGRES_USER:-riskledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskledger -d riskledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riskledger-api
    environment:
      PORT: 8080
      DEMO_MODE: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATABASE_URL: postgres://${POSTGRES_USER:-riskledger}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-riskledger}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
